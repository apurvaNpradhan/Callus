name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: http://127.0.0.1:3000
      VITE_WEB_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/callus
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22.23.2"
          cache: true
      - run: vp install --frozen-lockfile
      - name: Create non-production build environment
        run: touch packages/env/.env
      - name: Check workspace
        run: vp run check
      - name: Run unit tests
        run: vp run test:unit:run
      - name: Build workspace
        run: vp run build
