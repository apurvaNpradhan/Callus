name: callus

services:
  migrate:
    container_name: callus-migrate
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3001}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-callus}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace_me_run_pnpm_auth_secret_to_generate_a_real_value_here}"
    networks:
      - callus-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    container_name: callus-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        - "SOURCE_COMMIT=${SOURCE_COMMIT:-unknown}"
        - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}"
        - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3001}"
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3001}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-callus}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace_me_run_pnpm_auth_secret_to_generate_a_real_value_here}"
      - "ENABLE_OPEN_API_DOCS=${ENABLE_OPEN_API_DOCS:-false}"
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          base_path=$$(printf '%s' "$$VITE_SERVER_URL" |
            sed 's|^http[s]*://[^/]*||; s|/$||')
          wget -qO- "http://127.0.0.1:3000$${base_path}/health/live" || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - callus-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    container_name: callus-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - "SOURCE_COMMIT=${SOURCE_COMMIT:-unknown}"
        - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}"
        - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3001}"
        - "VITE_IMGPROXY_URL=${VITE_IMGPROXY_URL:-}"
        - "VITE_IMGPROXY_SIGNATURE=${VITE_IMGPROXY_SIGNATURE:-_}"
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3001}"
      - "VITE_IMGPROXY_URL=${VITE_IMGPROXY_URL:-}"
      - "VITE_IMGPROXY_SIGNATURE=${VITE_IMGPROXY_SIGNATURE:-_}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-callus}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace_me_run_pnpm_auth_secret_to_generate_a_real_value_here}"
    ports:
      - "${WEB_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          base_path=$$(printf '%s' "$$VITE_WEB_URL" |
            sed 's|^http[s]*://[^/]*||; s|/$||')
          wget -qO- \
            "http://127.0.0.1:3001$${base_path}/_api/health/live" ||
            exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - callus-network
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: callus-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}"
      - "POSTGRES_DB=${POSTGRES_DB:-callus}"
    volumes:
      - callus-pg-data:/var/lib/postgresql
    networks:
      - callus-network
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  callus-pg-data:

networks:
  callus-network:
