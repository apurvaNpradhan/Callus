name: callus

services:
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL}
    environment:
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      ENABLE_OPEN_API_DOCS: ${ENABLE_OPEN_API_DOCS:-false}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          base_path=$$(printf '%s' "$$VITE_SERVER_URL" |
            sed 's|^http[s]*://[^/]*||; s|/$||')
          wget -qO- "http://127.0.0.1:3000$${base_path}/health/live" || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL}
        VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:-}
        VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-_}
    environment:
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL}
      VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:-}
      VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-_}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          base_path=$$(printf '%s' "$$VITE_WEB_URL" |
            sed 's|^http[s]*://[^/]*||; s|/$||')
          wget -qO- \
            "http://127.0.0.1:3001$${base_path}/_api/health/live" ||
            exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - dokploy-network

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-callus}
    volumes:
      - callus-pg-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - default

volumes:
  callus-pg-data:

networks:
  default:
  dokploy-network:
    external: true
