services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callus
      POSTGRES_USER: callus
      POSTGRES_PASSWORD: callus
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callus -d callus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_local_data:
